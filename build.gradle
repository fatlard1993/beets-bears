plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.17'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.mod_id
}

repositories {
}

loom {
}

// Smoke and full gametests, configured once for the whole suite in Pandorical.
apply from: file("../pandorical/gametest.gradle")

dependencies {
	// Optional: better-companions integration, compile-only and never bundled. Resolved by the
	// version better-companions declares rather than one written down here: a pinned name kept
	// compiling green against the jar an old build left behind.
	def companionsProperties = file("../better-companions/gradle.properties")
	if (companionsProperties.exists()) {
		def companionsProps = new Properties()
		companionsProperties.withInputStream { companionsProps.load(it) }
		// Both read from its properties. The jar is named for whichever of the two naming
		// properties that mod uses - the suite is split between them - and never for its folder,
		// which matches neither. Guessing any of the three drifts the day one of them changes.
		def companionsName = companionsProps.getProperty("mod_id")
			?: companionsProps.getProperty("archives_base_name")
		def companionsVersion = companionsProps.getProperty("mod_version")
		def companionsJar = file("../better-companions/build/libs/${companionsName}-${companionsVersion}.jar")
		if (!companionsJar.exists()) {
			throw new GradleException("better-companions ${companionsVersion} is not built. Run" +
				" `mc-build better-companions` (or ./gradlew build in ../better-companions) first -" +
				" this mod compiles against its companion list.")
		}
		compileOnly files(companionsJar)
	}

	// Optional: block-tip integration, compile-only and never bundled. Resolved by the version
	// block-tip declares rather than one written down here: a pinned name kept compiling green
	// against the jar an old build left behind.
	def blockTipProperties = file("../block-tip/gradle.properties")
	if (blockTipProperties.exists()) {
		def blockTipProps = new Properties()
		blockTipProperties.withInputStream { blockTipProps.load(it) }
		def blockTipName = blockTipProps.getProperty("mod_id")
			?: blockTipProps.getProperty("archives_base_name")
		def blockTipVersion = blockTipProps.getProperty("mod_version")
		def blockTipJar = file("../block-tip/build/libs/${blockTipName}-${blockTipVersion}.jar")
		if (!blockTipJar.exists()) {
			throw new GradleException("block-tip ${blockTipVersion} is not built. Run" +
				" `mc-build block-tip` (or ./gradlew build in ../block-tip) first -" +
				" this mod compiles against its API.")
		}
		compileOnly files(blockTipJar)
	}

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation(project(':pandorical'))
}

// Fabric tests these predicates against the loader's *normalized* game version,
// not Mojang's id: 26.3-snapshot-10 is compared as 26.3-alpha.10. So a floor of
// ">=26.3" is false on every 26.3 snapshot, and writing the obvious thing makes
// the mod refuse to load on the version it was built for. Derived from the pin
// rather than written into the manifest, so the two cannot drift apart.
def mcFloor = project.minecraft_version
	.replaceFirst(/-snapshot-/, '-alpha.')
	.replaceFirst(/-pre-/, '-pre.')
	.replaceFirst(/-rc-/, '-rc.')
// The trailing dash is load-bearing: "<26.4" would still admit 26.4's snapshots,
// because a prerelease sorts below its own release.
def mcParts = mcFloor.tokenize('.-')
def minecraftDependency = ">=${mcFloor} <${mcParts[0]}.${(mcParts[1] as int) + 1}-"
// The +26.3 build tag is ignored in comparison; the floor is the number.
def fabricApiFloor = ">=" + project.fabric_version.replaceFirst(/\+.*$/, '')

processResources {
	inputs.property "version", project.version
	inputs.property "minecraftDependency", minecraftDependency
	inputs.property "loaderVersion", project.loader_version
	inputs.property "fabricApiVersion", fabricApiFloor
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
		       "minecraftDependency": minecraftDependency,
		       "loaderVersion": project.loader_version,
		       "fabricApiVersion": fabricApiFloor
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
	// The readme rides in the jar beside the licence, so a server can show it in-game.
	from("README.md") {
		rename { "README_${project.base.archivesName.get()}.md" }
	}
}
